[project]
site_name = "Matthew Grossman"
site_description = "Personal Website"
site_url = "https://mrgrossman.com"

# overrides/main.html is a standalone template that replaces the theme's
# layout, CSS and JS; the theme is only used for building
[project.theme]
custom_dir = "overrides"
favicon = "assets/favicon.webp"

[project.plugins.search]
enabled = false

[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
