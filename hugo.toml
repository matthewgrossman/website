baseURL = "https://www.mrgrossman.com/"
title = "Matthew Grossman"
disableKinds = ["taxonomy", "term", "rss"]

[params]
description = "Personal Website"

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.renderHooks.link]
useEmbedded = "fallback"

# lets relative links to files like assets/envoycon2022.pdf resolve from any page
[[module.mounts]]
source = "content"
target = "assets"
