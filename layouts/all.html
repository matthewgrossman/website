<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="{{ site.Params.description }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="icon" href="{{ "assets/favicon.webp" | relURL }}">
    <title>{{ with .Params.title }}{{ . }} - {{ end }}{{ site.Title }}</title>
    <style>
      body {
        max-width: 45rem;
        margin: 0 auto;
        padding: 1rem;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      .circular {
        border-radius: 50%;
      }

      .round {
        border-radius: 1%;
      }

      /* layout: resume */
      .resume {
        max-width: 50rem;
      }

      .resume h1, .resume h2 {
        margin: 0;
      }
    </style>
  </head>
  <body{{ with .Layout }} class="{{ . }}"{{ end }}>
    <main>
      {{ .Content }}
    </main>
  </body>
</html>
